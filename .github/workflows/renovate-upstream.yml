name: Weekly upstream Renovate

on:
  schedule:
    - cron: "15 17 * * 1"
  workflow_dispatch:
    inputs:
      apply:
        description: Open update pull requests
        type: boolean
        default: false

permissions: {}

concurrency:
  group: renovate-upstream

jobs:
  renovate:
    if: github.repository == 'SatoshiAndKin/evmspec'
    permissions:
      contents: write
      issues: read
      pull-requests: write
    uses: SatoshiAndKin/evmspec/.github/workflows/renovate-upstream-reviewed-linux.yml@80cd791e835c3900175ab0e5582d7916f12d0190
    with:
      dry-run: ${{ github.event_name == 'workflow_dispatch' && !inputs.apply }}
