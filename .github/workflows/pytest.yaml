name: PyTest

on:
  pull_request:
    branches: [master]
    paths:
      - '**.py'
      - '**/pytest.yaml'
      - '.github/workflows/pytest-reviewed.yaml'
      - 'pyproject.toml'
      - 'poetry.lock'
  schedule:
    - cron: '0 2 * * *' # Every day at 2:00 AM UTC

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


permissions:
  contents: read

jobs:
  test:
    uses: SatoshiAndKin/evmspec/.github/workflows/pytest-reviewed.yaml@ed7c625d9c0113fbff6f0f3e66ea71d79d9fd809
    secrets:
      ETHERSCAN_TOKEN: ${{ secrets.ETHERSCAN_TOKEN }}
